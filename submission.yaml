submission:
  title: "PortFlow AI"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
     Port operators nowadays use spreadsheers to manage all the port operations 
     which give unnecessary manual overhead such as 
     struggle to predict congestion and efficiently allocate
     berths, cranes, and yard capacity because vessel arrivals, resource
     availability, and service times are constantly changing.
     this process is very human error prone and inefficient since , once the issue is occured 
     then the staff realises it .So on-spot remediation is tough for them .

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    PortFlow AI is decision-support and managing platform that forecasts port 
    congestion using vessel schedules and operational capacity data, then uses constraint
    optimization to generate feasible berth and crane assignments. It provides
    congestion alerts in prior, explainable operational recommendations, and a
    72-hour planning view to help supervisors make faster, data-driven
    scheduling decisions.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - ""                               # e.g., "Real-time pipeline anomaly detection using watsonx.ai"
    - ""
    - ""
    - ""                               # optional 4th
    - ""                               # optional 5th

  tech_stack:
    languages: ["Python", "Javascript", "SQL"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["FastAPI","React.js","Tailwind CSS","SQLAlchemy"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBM Bob","IBM watsonx.ai"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["PostgreSQL"]                      # e.g., ["PostgreSQL", "Redis"]
    other: [Google OR-Tools CP-SAT, "sklearn","pandas","numpy"]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

